<script>
const D=window.EARTH360_DATA, id=new URLSearchParams(location.search).get('id'), s=D.students.find(x=>x.id===id), KEY='earth360_v1_state';
if(!s){document.body.innerHTML='<div style="color:white;text-align:center;padding:60px">الرابط غير صحيح.</div>';throw 0}
document.getElementById('name').textContent=s.name;document.getElementById('classLabel').textContent=s.classLabel;
let state=JSON.parse(localStorage.getItem(KEY)||'{}'), ev=(state[id]?.events||[]).filter(e=>!e.deleted), pts=ev.length*5;
let level=pts>=150?'خبيرة علم الأرض والفضاء 360°':pts>=100?'خبيرة':pts>=50?'متمكنة':'مستكشفة';
