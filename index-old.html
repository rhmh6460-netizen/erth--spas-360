*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:radial-gradient(circle at 50% -10%,#154d5d 0,#071b25 42%);color:var(--ink);min-height:100vh}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(#fff8 1px,transparent 1px);background-size:42px 42px;opacity:.08}
.wrap{max-width:1180px;margin:auto;padding:18px}.hero{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:22px;border:1px solid var(--line);background:#0b2631cc;border-radius:24px;backdrop-filter:blur(8px)}
h1{margin:0;font-size:clamp(26px,5vw,42px)}.sub{color:var(--muted);margin-top:7px}.planet{font-size:52px}
.card{background:#0d2733e8;border:1px solid var(--line);border-radius:20px;padding:18px;margin-top:14px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
select,input,button,textarea{font:inherit}select,input,textarea{background:#071b25;color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:12px}
select{min-width:260px}.grow{flex:1}.btn{border:0;border-radius:12px;padding:12px 14px;font-weight:800;cursor:pointer;background:var(--teal);color:#05201d}.btn.alt{background:var(--blue);color:#04192a}.btn.gold{background:var(--gold);color:#2b2000}.btn.danger{background:var(--danger);color:white}.btn.ghost{background:#173c48;color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}.stat{background:#0a202a;border:1px solid var(--line);border-radius:16px;padding:14px;text-align:center}.stat b{display:block;font-size:24px}

.stamps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}.stamp{border:1px solid var(--line);background:#0a202a;color:var(--ink);border-radius:14px;padding:11px;cursor:pointer;text-align:center}.stamp:hover{border-color:var(--teal)}.stamp b{display:block}.stamp small{color:var(--muted)}
.login{max-width:460px;margin:10vh auto}.hide{display:none!important}.notice{padding:10px 12px;border-radius:12px;background:#102f3b;color:#b9dfe5;margin-top:10px}.studentBox{margin-top:14px;padding:14px;border:1px solid var(--line);border-radius:16px;background:#09212b}
.actions{display:flex;gap:6px;flex-wrap:wrap}.mono{direction:ltr;text-align:left;font-family:monospace}.foot{color:#86a9b1;text-align:center;padding:22px;font-size:13px}
@media(max-width:760px){.grid{grid-template-columns:repeat(2,1fr)}.hero{align-items:flex-start}.planet{font-size:36px}.stamps{grid-template-columns:repeat(2,1fr)}}
</style>

function rec(id){if(!state[id])state[id]={events:[]}; return state[id]}
function awarded(id){return rec(id).events.filter(e=>!e.deleted)}
function stats(id){let a=awarded(id), pts=a.length*5, level=pts>=150?'خبيرة علم الأرض والفضاء 360°':pts>=100?'خبيرة':pts>=50?'متمكنة':'مستكشفة';return {n:a.length,pts,level}}
function studentUrl(id){return new URL('student.html?id='+encodeURIComponent(id),location.href).href}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
$('teacher').textContent=D.teacherName;
for(const [id,c] of Object.entries(D.classes)){let o=document.createElement('option');o.value=id;o.textContent=c.label; $('classSelect').appendChild(o)}
function render(){
 const cls=$('classSelect').value,q=$('search').value.trim();
 let list=D.students.filter(s=>s.classId===cls && (!q||s.name.includes(q)));
 $('studentCount').textContent=D.students.filter(s=>s.classId===cls).length;
 let ts=0,tp=0,ac=0; D.students.filter(s=>s.classId===cls).forEach(s=>{let x=stats(s.id);ts+=x.n;tp+=x.pts;if(x.n)ac++});
 $('stampTotal').textContent=ts;$('pointTotal').textContent=tp;$('activeCount').textContent=ac;
 $('tbody').innerHTML=list.map(s=>{let x=stats(s.id);return `<tr><td class="name">${esc(s.name)}<br><span class="pill">${esc(s.classLabel)}</span></td><td>${x.n}</td><td>${x.pts}</td><td>${x.level}</td><td><div class="actions"><button class="btn gold" onclick="openStudent('${s.id}')">منح ختم</button><button class="btn alt" onclick="copyLink('${s.id}')">نسخ الرابط</button><button class="btn danger" onclick="undoLast('${s.id}')">حذف آخر ختم</button></div><div id="box-${s.id}"></div></td></tr>`}).join('');
}
window.openStudent=id=>{
 const s=D.students.find(x=>x.id===id), box=$('box-'+id); if(!box)return;
 const options=[['أفهمها','أتقنتُها','🧠'],['أكتشفها','اكتشفتُها','🔭'],['أستكشفها','استكشفتُها','🌋'],['أوظفها','وظفتُها','🚀']];
 box.innerHTML=`<div class="studentBox"><b>${esc(s.name)}</b><div class="stamps">${options.map(o=>`<button class="stamp" onclick="award('${id}','${o[0]}','${o[1]}')"><b>${o[2]} ${o[0]}</b><small>${o[1]} • 5 نقاط</small></button>`).join('')}</div><input id="note-${id}" style="width:100%;margin-top:8px" placeholder="ملاحظة اختيارية"></div>`
}
window.award=(id,station,stamp)=>{
 let note=$('note-'+id)?.value||'';
 rec(id).events.push({station,stamp,note,date:new Date().toISOString(),deleted:false});save();render()
}
window.undoLast=id=>{let ev=rec(id).events;for(let i=ev.length-1;i>=0;i--){if(!ev[i].deleted){ev[i].deleted=true;break}}save();render()}
window.copyLink=async id=>{await navigator.clipboard.writeText(studentUrl(id));alert('تم نسخ رابط الطالبة')}
$('copyClass').onclick=async()=>{let cls=$('classSelect').value;let text=D.students.filter(s=>s.classId===cls).map(s=>`${s.name}\n${studentUrl(s.id)}`).join('\n\n');await navigator.clipboard.writeText(text);alert('تم نسخ روابط الفصل كاملة')}
$('exportBtn').onclick=()=>{let b=new Blob([JSON.stringify({version:1,state},null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='earth360-backup.json';a.click()}
$('importFile').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);state=d.state||{};save();render();alert('تم الاستيراد')}catch{alert('الملف غير صالح')}};r.readAsText(f)}
$('classSelect').onchange=render;$('search').oninput=render;
$('loginBtn').onclick=()=>{if($('email').value.replace(/\s+/g,'').toLowerCase()===D.teacherEmail.replace(/\s+/g,'').toLowerCase()){sessionStorage.setItem('earth360_login','1');$('login').classList.add('hide');$('app').classList.remove('hide');render()}else{$('loginMsg').textContent='البريد غير مطابق لبريد المعلمة.';$('loginMsg').classList.remove('hide')}}
$('email').addEventListener('keydown',e=>{if(e.key==='Enter')$('loginBtn').click()});
if(sessionStorage.getItem('earth360_login')==='1'){$('login').classList.add('hide');$('app').classList.remove('hide');render()}
</script>
</body></html>
